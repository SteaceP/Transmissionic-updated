name: No Response

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '5 */12 * * *'

permissions:
  issues: write

jobs:
  noResponse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        if: ${{ !env.ACT }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-issue-labels: 'more information needed'
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-message: 'This issue is waiting for author response and will be closed if no response is given.'
          close-issue-message: 'Closed due to inactivity after requesting more information.'

name: Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependencies:
    name: Check version and install dependencies
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new_version: ${{ steps.version.outputs.is_new_version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version
        id: version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
          if [ -n "$ACT" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "Triggered via ${{ github.event_name }} or ACT: proceeding."
          elif git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "$VERSION"; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION has already been released on GitHub. Skipping release."
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "New version $VERSION detected! Release will be published."
          fi

      - name: Create Release
        id: create_release
        if: ${{ !env.ACT && steps.version.outputs.is_new_version == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

  build-webui:
    name: Build WebUI
    needs: dependencies
    if: ${{ needs.dependencies.outputs.is_new_version == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pre-build
        run: npm run prebuild:webui

      - name: Build
        run: npm run build

      - name: Post-build
        run: npm run postbuild:webui

      - name: Create zip
        run: |
          mv ./dist/ ./web/
          zip -r "Transmissionic-webui-${{ needs.dependencies.outputs.version }}.zip" ./web/

      - name: Upload Release Asset
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.dependencies.outputs.version }}
          files: Transmissionic-webui-${{ needs.dependencies.outputs.version }}.zip
          draft: false

  build-electron-linux:
    name: Build Electron Linux
    needs: dependencies
    if: ${{ needs.dependencies.outputs.is_new_version == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web assets
        run: |
          npm run build
          npx cap sync @capacitor-community/electron
          npx cap copy @capacitor-community/electron

      - name: Post-build
        run: npm run postbuild:electron

      - name: Install electron dependencies
        working-directory: ./electron
        run: npm ci

      - name: Build and publish electron
        if: ${{ !env.ACT }}
        working-directory: ./electron
        run: npm run electron:publish-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build electron
        if: ${{ env.ACT }}
        working-directory: ./electron
        run: npm run electron:build-linux

  build-electron-win:
    name: Build Electron Windows
    needs: dependencies
    if: ${{ needs.dependencies.outputs.is_new_version == 'true' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web assets
        run: |
          npm run build
          npx cap sync @capacitor-community/electron
          npx cap copy @capacitor-community/electron

      - name: Post-build
        run: npm run postbuild:electron

      - name: Install electron dependencies
        working-directory: ./electron
        run: npm ci

      - name: Build and publish electron
        if: ${{ !env.ACT }}
        working-directory: ./electron
        run: npm run electron:publish-windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build electron
        if: ${{ env.ACT }}
        working-directory: ./electron
        run: npm run electron:build-windows

  build-electron-mac:
    name: Build Electron macOS
    needs: dependencies
    if: ${{ needs.dependencies.outputs.is_new_version == 'true' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web assets
        run: |
          npm run build
          npx cap sync @capacitor-community/electron
          npx cap copy @capacitor-community/electron

      - name: Post-build
        run: npm run postbuild:electron

      - name: Install electron dependencies
        working-directory: ./electron
        run: npm ci

      - name: Build and publish electron
        if: ${{ !env.ACT }}
        working-directory: ./electron
        run: npm run electron:publish-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build electron
        if: ${{ env.ACT }}
        working-directory: ./electron
        run: npm run electron:build-mac

  build-android:
    name: Build Android
    needs: dependencies
    if: ${{ needs.dependencies.outputs.is_new_version == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web assets
        run: |
          npm run build
          npx cap sync android
          npx cap copy android

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Bundle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - uses: ilharp/sign-android-release@v2
        name: Sign APK
        id: sign_apk
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        with:
          releaseDir: ./android/app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          buildToolsVersion: 36.0.0

      - uses: ilharp/sign-android-release@v2
        name: Sign Bundle
        id: sign_bundle
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        with:
          releaseDir: ./android/app/build/outputs/bundle/release
          signingKey: ${{ secrets.SIGNING_KEY }}
          keyAlias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Prepare APK Release Asset
        id: prepare_apk
        run: |
          if [ -n "${{ steps.sign_apk.outputs.signedFile }}" ] && [ -f "${{ steps.sign_apk.outputs.signedFile }}" ]; then
            cp "${{ steps.sign_apk.outputs.signedFile }}" "Transmissionic-android-${{ needs.dependencies.outputs.version }}.apk"
            echo "apk_path=Transmissionic-android-${{ needs.dependencies.outputs.version }}.apk" >> "$GITHUB_OUTPUT"
          elif [ -f "./android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp "./android/app/build/outputs/apk/release/app-release-unsigned.apk" "Transmissionic-android-${{ needs.dependencies.outputs.version }}.apk"
            echo "apk_path=Transmissionic-android-${{ needs.dependencies.outputs.version }}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: ${{ !env.ACT && steps.prepare_apk.outputs.apk_path != '' }}
        with:
          tag_name: ${{ needs.dependencies.outputs.version }}
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v7
        if: ${{ steps.sign_bundle.outputs.signedFile != '' }}
        with:
          name: Transmissionic-android-${{ needs.dependencies.outputs.version }}.aab
          path: ${{ steps.sign_bundle.outputs.signedFile }}
          retention-days: 30

  build-ios:
    name: Build iOS
    needs: dependencies
    if: ${{ needs.dependencies.outputs.is_new_version == 'true' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Build and sync web assets
        run: |
          npm run build
          npx cap sync ios
          npx cap copy ios

      - name: Build IPA
        working-directory: ./ios/App
        run: |
          xcodebuild -sdk iphoneos -workspace App.xcworkspace/ -scheme App -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO"
          mkdir -p Payload
          mv ~/Library/Developer/Xcode/DerivedData/App-*/Build/Products/Release-iphoneos/App.app Payload
          zip -r "Transmissionic-ios-${{ needs.dependencies.outputs.version }}.ipa" Payload

      - name: Upload Release Asset
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.dependencies.outputs.version }}
          files: ./ios/App/Transmissionic-ios-${{ needs.dependencies.outputs.version }}.ipa
          draft: false
